<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">ShipSure — evidence-first deployment diagnosis</title>
  <desc id="desc">Blue ShipSure banner showing an evidence-to-cause-to-safe-fix workflow and supported deployment platforms.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b46"/>
      <stop offset="0.56" stop-color="#0757c8"/>
      <stop offset="1" stop-color="#138bd4"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123e83" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0a285a" stop-opacity="0.92"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="12%" r="68%">
      <stop offset="0" stop-color="#52d7ff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#52d7ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#b9e9ff" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="340" rx="28" fill="url(#background)"/>
  <rect width="1200" height="340" rx="28" fill="url(#glow)"/>
  <rect width="1200" height="340" rx="28" fill="url(#grid)"/>
  <circle cx="1090" cy="42" r="118" fill="#70e0ff" opacity="0.06"/>
  <circle cx="1100" cy="285" r="150" fill="#70e0ff" opacity="0.05"/>

