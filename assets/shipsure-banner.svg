      <path d="M46 13v15h14M23 38h25M23 49h14" fill="none" stroke="#8de8ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="m39 57 7 7 13-15" fill="none" stroke="#8de8ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
