      <text x="260" y="242" text-anchor="middle">CLI</text>
      <rect x="311" y="220" width="196" height="34" rx="17" fill="#ffffff" fill-opacity="0.14" stroke="#bdefff" stroke-opacity="0.55"/>
      <text x="409" y="242" text-anchor="middle">CODEX + CLAUDE SKILLS</text>
