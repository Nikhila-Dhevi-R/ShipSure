      <text x="28" y="38" font-size="12" font-weight="700" letter-spacing="1.7" fill="#8ce6ff">FROM SIGNAL TO SAFE ACTION</text>
      <path d="M82 96h253" stroke="#76dfff" stroke-opacity="0.7" stroke-width="2" stroke-dasharray="5 7"/>
      <g text-anchor="middle">
