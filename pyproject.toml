[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "shipsure"
version = "0.1.0"
description = "Evidence-based deployment diagnosis and safe verification for agentic workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "ShipSure contributors" }]
keywords = ["deployment", "diagnostics", "mcp", "devops", "agent-skill"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Debuggers",
]
dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
aws = ["boto3>=1.35,<2"]
dev = ["pytest>=8,<9", "build>=1.2,<2", "ruff>=0.8,<1", "mypy>=1.13,<2"]
all = ["mcp>=2,<3", "boto3>=1.35,<2"]

[project.scripts]
shipsure = "shipsure.cli:app"
shipsure-mcp = "shipsure.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/shipsure"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
